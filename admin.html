<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Video Downloader</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #0066ff; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .auth-box, .downloader-box { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #0066ff; }
        button { width: 100%; background: #0066ff; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; margin-top: 8px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .pro-badge { background: #ffc107; color: #000; }
        .free-badge { background: #e9ecef; color: #495057; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 8px; background: #e2f0d9; border-left: 4px solid #28a745; display: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📥 Chinh Video Downloader</h1>
    <p class="subtitle">Tải video đa nền tảng không giới hạn</p>

    <!-- PHẦN ĐĂNG NHẬP / KIỂM TRA TÀI KHOẢN NGƯỜI DÙNG -->
    <div class="auth-box">
        <h3>👤 Tài khoản của bạn</h3>
        <div class="form-group">
            <label>Tên đăng nhập:</label>
            <input type="text" id="loginUsername" placeholder="Nhập username của bạn...">
        </div>
        <button onclick="userLogin()">Đăng nhập / Kiểm tra hạn</button>
        
        <div id="userInfo" style="margin-top: 15px; display: none; font-size: 14px; line-height: 1.6;">
            - Trạng thái: <span id="userStatusBadge" class="status-badge free-badge">Free</span><br>
            - Hạn dùng thử/Pro đến: <span id="userExpire">--</span>
        </div>
    </div>

    <!-- PHẦN TRANG CHỦ TẢI VIDEO -->
    <div class="downloader-box">
        <h3>🔗 Tải video</h3>
        <div class="form-group">
            <label>Dán link video:</label>
            <input type="text" id="videoUrl" placeholder="https://...">
        </div>
        <button onclick="downloadVideo()">Bắt đầu tải</button>
        <div id="downloadResult" class="result-box"></div>
    </div>
</div>

<script src="script.js"></script>
<script>
    const API_URL = "https://chinh-video-api.onrender.com";

    async function userLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const infoBox = document.getElementById('userInfo');
        const badge = document.getElementById('userStatusBadge');
        const expireText = document.getElementById('userExpire');

        if (!username) {
            alert('Vui lòng nhập tên tài khoản!');
            return;
        }

        try {
            const res = await fetch(`${API_URL}/api/user/${username}`);
            infoBox.style.display = 'block';

            if (!res.ok) {
                badge.className = 'status-badge free-badge';
                badge.innerText = 'Không tồn tại';
                expireText.innerText = 'Tài khoản chưa được đăng ký trên hệ thống.';
                return;
            }

            const data = await res.json();
            if (data.is_pro) {
                badge.className = 'status-badge pro-badge';
                badge.innerText = 'PRO ⭐';
            } else {
                badge.className = 'status-badge free-badge';
                badge.innerText = 'FREE';
            }
            expireText.innerText = new Date(data.trial_expires_at).toLocaleString();
        } catch (err) {
            alert('Không thể kết nối đến máy chủ API!');
        }
    }

    function downloadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const resultBox = document.getElementById('downloadResult');

        if (!url) {
            alert('Vui lòng nhập link video!');
            return;
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = '⏳ Đang xử lý yêu cầu tải video từ máy chủ...';
        
        // Gọi logic xử lý file script.js của bạn tại đây
    }
</script>
</body>
</html>
