<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh Video Downloader & Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-section {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #333;
        }
        .admin-section h2 { text-align: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .btn-admin { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-check { background: #0066ff; color: white; }
        .btn-update { background: #28a745; color: white; }
        .result-box { margin-top: 15px; padding: 12px; border-radius: 8px; background: #f8f9fa; border-left: 4px solid #0066ff; display: none; font-size: 14px; }
    </style>
</head>
<body>

    <!-- KHU VỰC TẢI VIDEO DÀNH CHO NGƯỜI DÙNG -->
    <div class="main-container">
        <h1>📥 Chinh Video Downloader</h1>
        <p>Tải video đa nền tảng dễ dàng</p>
    </div>

    <!-- KHU VỰC QUẢN LÝ TÀI KHOẢN (ADMIN) -->
    <div class="admin-section">
        <h2>🛠️ Quản lý tài khoản Admin</h2>
        
        <div class="form-group">
            <label>Link API Render:</label>
            <input type="text" id="apiUrl" value="https://chinh-video-api.onrender.com">
        </div>

        <div class="form-group">
            <label>Tên tài khoản (Username):</label>
            <input type="text" id="username" placeholder="Nhập tên user (VD: chinhly_212)">
        </div>

        <button class="btn-admin btn-check" onclick="checkUser()">Kiểm tra thông tin</button>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <div class="form-group">
            <label>Cấp quyền Pro:</label>
            <select id="isPro">
                <option value="true">Bật Pro (True)</option>
                <option value="false">Tắt Pro (False)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cộng thêm ngày dùng thử:</label>
            <input type="number" id="extendDays" value="14">
        </div>

        <button class="btn-admin btn-update" onclick="updateUser()">Cập nhật ngay</button>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script src="script.js"></script>
    <script>
        async function checkUser() {
            const url = document.getElementById('apiUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const box = document.getElementById('resultBox');
            
            if (!username) { 
                alert('Vui lòng nhập tên tài khoản!'); 
                return; 
            }
            
            try {
                const res = await fetch(`${url}/api/user/${username}`);
                box.style.display = 'block';
                
                if (res.status === 404) {
                    box.style.borderLeftColor = '#e41e3f';
                    box.innerHTML = `<span style="color:#e41e3f; font-weight:bold;">❌ Lỗi 404: Tài khoản "${username}" không tồn tại!</span>`;
                    return;
                }

                const data = await res.json();
                box.style.borderLeftColor = '#0066ff';
                box.innerHTML = `<b>Thông tin tài khoản:</b><br>` +
                                `- User: ${data.username}<br>` +
                                `- Pro: <b>${data.is_pro ? 'Đang bật ⭐' : 'Chưa bật'}</b><br>` +
                                `- Còn hạn dùng thử: ${data.is_trial_active ? 'Còn' : 'Hết'}<br>` +
                                `- Hết hạn: ${new Date(data.trial_expires_at).toLocaleString()}`;
            } catch (err) { 
                box.style.display = 'block'; 
                box.style.borderLeftColor = '#e41e3f';
                box.innerHTML = `<span style="color:#e41e3f;">⚠️ Lỗi kết nối đến máy chủ API!</span>`; 
            }
        }

        async function updateUser() {
            const url = document.getElementById('apiUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const isPro = document.getElementById('isPro').value === 'true';
            const extendDays = parseInt(document.getElementById('extendDays').value) || 0;
            const box = document.getElementById('resultBox');
            
            if (!username) { 
                alert('Vui lòng nhập tên tài khoản!'); 
                return; 
            }
            
            try {
                const res = await fetch(`${url}/api/admin/update-user/${username}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_pro: isPro, extend_days: extendDays })
                });
                
                box.style.display = 'block';
                
                if (res.status === 404) {
                    box.style.borderLeftColor = '#e41e3f';
                    box.innerHTML = `<span style="color:#e41e3f; font-weight:bold;">❌ Lỗi 404: Không thể cập nhật vì tài khoản không tồn tại!</span>`;
                    return;
                }

                const data = await res.json();
                box.style.borderLeftColor = '#28a745';
                box.innerHTML = `<span style="color:#28a745; font-weight:bold;">✅ ${data.message || 'Cập nhật thành công!'}</span>`;
                
                checkUser();
            } catch (err) { 
                box.style.display = 'block'; 
                box.style.borderLeftColor = '#e41e3f';
                box.innerHTML = `<span style="color:#e41e3f;">⚠️ Lỗi kết nối khi cập nhật!</span>`; 
            }
        }
    </script>
</body>
</html>
